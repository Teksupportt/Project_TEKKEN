services:
  combat_ws:
    build: .
    container_name: combat_ws
    network_mode: host
    environment:
      - ROS_DOMAIN_ID=0   # must match the simulator's ROS_DOMAIN_ID
      - DISPLAY=${DISPLAY}
      - WAYLAND_DISPLAY=${WAYLAND_DISPLAY}
      - XDG_RUNTIME_DIR=${XDG_RUNTIME_DIR}
      - PULSE_SERVER=${PULSE_SERVER}
    volumes:
      - ./src:/combat_ws/src
      - /tmp/.X11-unix:/tmp/.X11-unix
      - /mnt/wslg:/mnt/wslg
    stdin_open: true
    tty: true
    command: bash -c "source install/setup.bash && ros2 launch combat_sim multi_robot_bringup.launch.py"
